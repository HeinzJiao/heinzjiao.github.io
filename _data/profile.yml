short_bio: >-
  <p>I am a postdoctoral researcher in the Department of Geoinformatics at the
  <a href="https://www.itc.nl/">Faculty of Geo-Information Science and Earth Observation (ITC)</a>,
  University of Twente, the Netherlands.</p>
  <p>My research brings together <strong>GeoAI, computer vision, and topographic mapping</strong>.
  I develop methods that turn aerial imagery into structured vector maps, with an emphasis on
  accurate polygon geometry, consistent shared boundaries, and generative modelling.
  My work spans building outlines, road polygons, and seamless multi-class vector basemaps.</p>
  <p>I received my Ph.D. in Geoinformatics from the University of Twente in September 2026,
  supervised by Claudio Persello, George Vosselman, and Hao Cheng. My current research
  investigates cross-region generalization of vector basemap generation, including applications
  to informal settlements and the built environment in cities in the Global South.</p>
research_interests:
